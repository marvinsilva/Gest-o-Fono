<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Fonoaudiologia - HCPA</title>
  
  <!-- Estilos visuais da página -->
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
      background-color: #f0f2f5;
      color: #1c1e21;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      color: #004085;
      margin: 0 0 8px 0;
    }
    p.sub {
      color: #6c757d;
      margin: 0;
    }

    /* Container do Filtro */
    .filter-container {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .filter-container label {
      font-weight: bold;
      color: #004085;
      font-size: 14px;
    }
    .filter-container select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ced4da;
      font-size: 14px;
      min-width: 250px;
      outline: none;
      background-color: #fff;
      cursor: pointer;
    }
    
    /* Grid dos cartões de métricas (KPIs) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .kpi-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 5px solid #0056b3;
    }
    .kpi-card h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-card p {
      margin: 0;
      font-size: 32px;
      font-weight: bold;
      color: #1c1e21;
    }

    /* Grid dos gráficos */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 25px;
    }
    .chart-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .chart-card h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 15px;
      color: #333;
    }
  </style>

  <!-- Biblioteca PapaParse e Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>Atendimentos Fonoaudiologia — HCPA</h1>
    <p class="sub">Painel demonstrativo baseado em dados extraídos via CSV</p>
  </header>

  <!-- Filtro por Local/Área de Atendimento -->
  <div class="filter-container">
    <label for="select-area">Filtrar por Área de Atendimento:</label>
    <select id="select-area" onchange="aplicarFiltro()">
      <option value="TODAS">Todas as Áreas</option>
    </select>
  </div>

  <!-- Cartões de Resumo (KPIs) -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <h3>Pacientes Únicos</h3>
      <p id="kpi-total-unicos">-</p>
    </div>
    <div class="kpi-card" style="border-left-color: #28a745;">
      <h3>Total de Registros</h3>
      <p id="kpi-total-registros">-</p>
    </div>
    <div class="kpi-card" style="border-left-color: #ffc107;">
      <h3>Tempo Médio de Resposta</h3>
      <p id="kpi-tempo-medio">-</p>
    </div>
  </div>

  <!-- Área de Gráficos -->
  <div class="charts-grid">
    <div class="chart-card">
      <h2>Atendimentos por Consultor</h2>
      <canvas id="graficoConsultores"></canvas>
    </div>
    <div class="chart-card">
      <h2>Distribuição por Turno</h2>
      <canvas id="graficoTurnos"></canvas>
    </div>
  </div>

  <script>
    const NOME_ARQUIVO_CSV = "atendimentos.csv";
    
    // Variáveis globais para guardar as instâncias dos gráficos e o total de dados lidos
    let dadosBrutosCSV = [];
    let instanciaGraficoBarras = null;
    let instanciaGraficoPizza = null;

    // Converte vírgula do Excel em ponto para o JS calcular
    function converterParaNumero(valor) {
      if (!valor) return NaN;
      if (typeof valor === 'number') return valor;
      const limpo = String(valor).replace(',', '.').trim();
      return parseFloat(limpo);
    }

    // Povoa o <select> com todas as áreas disponíveis no CSV
    function preencherOpcoesDeFiltro(linhas) {
      const select = document.getElementById('select-area');
      const areasUnicas = new Set();

      linhas.forEach(linha => {
        const local = linha['LOCAL_ATEND'];
        if (local && String(local).trim() !== '') {
          areasUnicas.add(String(local).trim());
        }
      });

      // Ordena alfabeticamente os nomes das áreas
      Array.from(areasUnicas).sort().forEach(area => {
        const option = document.createElement('option');
        option.value = area;
        option.textContent = area;
        select.appendChild(option);
      });
    }

    // Função disparada quando o usuário troca a seleção no menu
    function aplicarFiltro() {
      const areaSelecionada = document.getElementById('select-area').value;

      let dadosFiltrados = dadosBrutosCSV;

      if (areaSelecionada !== 'TODAS') {
        dadosFiltrados = dadosBrutosCSV.filter(linha => {
          const local = linha['LOCAL_ATEND'];
          return local && String(local).trim() === areaSelecionada;
        });
      }

      // Reprocessa os gráficos e indicadores usando só os dados filtrados
      processarDadosCSV(dadosFiltrados);
    }

    function processarDadosCSV(linhas) {
      const idsProcessados = new Set();
      const consultores = {};
      const turnos = {};
      let somaEspera = 0;
      let qtdEsperaValida = 0;

      linhas.forEach(linha => {
        const idAtendimento = linha['NOME_PACIENTE'];
        const consultor     = linha['CONSULTOR'];
        const turno         = linha['TURNO'];
        
        const valorTempo = linha['TEMPO_RESPOSTA_HORAS'] || linha['TEMPO_RESPOSTA_DIAS'];
        const tempoEspera = converterParaNumero(valorTempo);

        if (!idAtendimento || String(idAtendimento).trim() === '') return;

        // 1. Pacientes Únicos
        idsProcessados.add(String(idAtendimento).trim());

        // 2. Por Consultor
        if (consultor && String(consultor).trim() !== '') {
          const nomeConsultor = String(consultor).trim();
          consultores[nomeConsultor] = (consultores[nomeConsultor] || 0) + 1;
        }

        // 3. Por Turno
        if (turno && String(turno).trim() !== '') {
          const nomeTurno = String(turno).trim();
          turnos[nomeTurno] = (turnos[nomeTurno] || 0) + 1;
        }

        // 4. Média de tempo
        if (!isNaN(tempoEspera)) {
          somaEspera += tempoEspera;
          qtdEsperaValida++;
        }
      });

      // Atualiza os cartões de indicadores
      document.getElementById('kpi-total-unicos').innerText = idsProcessados.size;
      document.getElementById('kpi-total-registros').innerText = linhas.length;
      
      const mediaFinal = qtdEsperaValida > 0 ? (somaEspera / qtdEsperaValida).toFixed(1) : 0;
      document.getElementById('kpi-tempo-medio').innerText = `${mediaFinal} h`;

      // Renderiza/Atualiza os gráficos
      renderizarGraficoBarras('graficoConsultores', Object.keys(consultores), Object.values(consultores), 'Atendimentos');
      renderizarGraficoPizza('graficoTurnos', Object.keys(turnos), Object.values(turnos));
    }

    function renderizarGraficoBarras(idCanvas, rotulos, dados, legenda) {
      // Destrói o gráfico antigo antes de criar o novo (necessário no filtro)
      if (instanciaGraficoBarras) {
        instanciaGraficoBarras.destroy();
      }

      const ctx = document.getElementById(idCanvas).getContext('2d');
      instanciaGraficoBarras = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: rotulos,
          datasets: [{
            label: legenda,
            data: dados,
            backgroundColor: '#0056b3',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderizarGraficoPizza(idCanvas, rotulos, dados) {
      // Destrói o gráfico antigo antes de criar o novo (necessário no filtro)
      if (instanciaGraficoPizza) {
        instanciaGraficoPizza.destroy();
      }

      const ctx = document.getElementById(idCanvas).getContext('2d');
      instanciaGraficoPizza = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: rotulos,
          datasets: [{
            data: dados,
            backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6f42c1', '#17a2b8', '#fd7e14']
          }]
        },
        options: {
          responsive: true
        }
      });
    }

    // Leitura Inicial do CSV
    Papa.parse(NOME_ARQUIVO_CSV, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        if (results.data && results.data.length > 0) {
          dadosBrutosCSV = results.data; // Guarda os dados originais
          preencherOpcoesDeFiltro(dadosBrutosCSV); // Cria as opções do menu
          processarDadosCSV(dadosBrutosCSV); // Exibe o estado inicial (todas as áreas)
        }
      }
    });
  </script>
</body>
</html>
