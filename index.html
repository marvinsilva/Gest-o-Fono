<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Fonoaudiologia - HCPA</title>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
      background-color: #f0f2f5;
      color: #1c1e21;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      color: #004085;
      margin: 0 0 8px 0;
    }
    p.sub {
      color: #6c757d;
      margin: 0;
    }

    /* Container do Filtro Customizado */
    .filter-container {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 25px;
      position: relative;
    }
    .filter-label {
      font-weight: bold;
      color: #004085;
      font-size: 14px;
      margin-bottom: 8px;
      display: block;
    }

    /* Botão que abre o Dropdown */
    .dropdown-btn {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #ced4da;
      background-color: #fff;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #333;
    }
    .dropdown-btn:after {
      content: "▼";
      font-size: 10px;
      color: #6c757d;
    }

    /* Painel Flutuante de Checkboxes */
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #ffffff;
      min-width: 380px;
      max-width: 450px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.15);
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      padding: 10px;
      z-index: 100;
      margin-top: 5px;
    }
    .dropdown-content.show {
      display: block;
    }

    /* Campo de Busca dentro do filtro */
    .search-box {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }

    /* Lista com Scroll */
    .checkbox-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #333;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .checkbox-item:hover {
      background-color: #f0f4f8;
    }
    .checkbox-item input {
      cursor: pointer;
    }

    /* Grid dos cartões de métricas (KPIs) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .kpi-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 5px solid #0056b3;
    }
    .kpi-card h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-card p {
      margin: 0;
      font-size: 32px;
      font-weight: bold;
      color: #1c1e21;
    }

    /* Grid dos gráficos */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 25px;
    }
    .chart-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .chart-card h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 15px;
      color: #333;
    }
  </style>

  <!-- Biblioteca PapaParse e Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>Gestão Fonoaudiologia — HCPA</h1>
    <p class="sub">Painel de gestão com dados extraídos do AGHUSE</p>
  </header>

  <!-- Filtro por Área de Atendimento com Checkboxes -->
  <div class="filter-container">
    <span class="filter-label">Filtrar por Área(s) de Atendimento:</span>
    
    <button id="btn-dropdown" class="dropdown-btn" onclick="alternarDropdown()">
      <span id="btn-text">Todas as Áreas selecionadas</span>
    </button>

    <div id="dropdown-list" class="dropdown-content">
      <input type="text" id="input-busca" class="search-box" placeholder="Pesquisar área..." onkeyup="filtrarListaOpcoes()">
      
      <div class="checkbox-list">
        <label class="checkbox-item">
          <input type="checkbox" id="chk-todos" checked onchange="marcarTodos(this)">
          <b>-- Selecionar Todas --</b>
        </label>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 4px 0;">
        <div id="lista-checkboxes"></div>
      </div>
    </div>
  </div>

  <!-- Cartões de Resumo (KPIs) -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <h3>Pacientes</h3>
      <p id="kpi-total-unicos">-</p>
    </div>
    <div class="kpi-card" style="border-left-color: #28a745;">
      <h3>Total de Atendimentos</h3>
      <p id="kpi-total-registros">-</p>
    </div>
    <div class="kpi-card" style="border-left-color: #ffc107;">
      <h3>Tempo Médio de Resposta</h3>
      <p id="kpi-tempo-medio">-</p>
    </div>
  </div>

  <!-- Área de Gráficos -->
  <div class="charts-grid">
    <div class="chart-card">
      <h2>Atendimentos por Consultor</h2>
      <canvas id="graficoConsultores"></canvas>
    </div>
    <div class="chart-card">
      <h2>Distribuição por Turno</h2>
      <canvas id="graficoTurnos"></canvas>
    </div>
  </div>

  <script>
    const NOME_ARQUIVO_CSV = "RelatorioConsultoriaDeInternacaoFonoaudiologia_202608223.csv";
    
    let dadosBrutosCSV = [];
    let instanciaGraficoBarras = null;
    let instanciaGraficoPizza = null;

    function converterParaNumero(valor) {
      if (!valor) return NaN;
      if (typeof valor === 'number') return valor;
      const limpo = String(valor).replace(',', '.').trim();
      return parseFloat(limpo);
    }

    // Abre/fecha a caixa do menu flutuante
    function alternarDropdown() {
      document.getElementById('dropdown-list').classList.toggle('show');
    }

    // Fecha o menu se o usuário clicar fora dele
    window.onclick = function(event) {
      if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content')) {
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          dropdowns[i].classList.remove('show');
        }
      }
    }

    // Filtra visualmente as opções da lista enquanto digita na busca
    function filtrarListaOpcoes() {
      const termo = document.getElementById('input-busca').value.toLowerCase();
      const itens = document.querySelectorAll('#lista-checkboxes .checkbox-item');
      
      itens.forEach(item => {
        const texto = item.textContent.toLowerCase();
        item.style.display = texto.includes(termo) ? 'flex' : 'none';
      });
    }

    // Preenche dinamicamente as caixas de seleção com as áreas lidas no CSV
    function preencherOpcoesDeFiltro(linhas) {
      const conteiner = document.getElementById('lista-checkboxes');
      conteiner.innerHTML = '';
      const areasUnicas = new Set();

      linhas.forEach(linha => {
        const local = linha['LOCAL_ATEND'];
        if (local && String(local).trim() !== '') {
          areasUnicas.add(String(local).trim());
        }
      });

      Array.from(areasUnicas).sort().forEach(area => {
        const label = document.createElement('label');
        label.className = 'checkbox-item';
        
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.value = area;
        chk.checked = true;
        chk.className = 'chk-area';
        chk.onchange = aplicarFiltro;

        label.appendChild(chk);
        label.appendChild(document.createTextNode(area));
        conteiner.appendChild(label);
      });
    }

    // Lógica do checkbox "-- Selecionar Todas --"
    function marcarTodos(source) {
      const checkboxes = document.querySelectorAll('.chk-area');
      checkboxes.forEach(chk => chk.checked = source.checked);
      aplicarFiltro();
    }

    function aplicarFiltro() {
      const checkboxes = document.querySelectorAll('.chk-area');
      const selecionadas = Array.from(checkboxes).filter(chk => chk.checked).map(chk => chk.value);
      const chkTodos = document.getElementById('chk-todos');
      const btnText = document.getElementById('btn-text');

      // Atualiza o texto do botão
      if (selecionadas.length === checkboxes.length) {
        btnText.innerText = "Todas as Áreas selecionadas";
        chkTodos.checked = true;
      } else if (selecionadas.length === 0) {
        btnText.innerText = "Nenhuma área selecionada";
        chkTodos.checked = false;
      } else {
        btnText.innerText = `${selecionadas.length} área(s) selecionada(s)`;
        chkTodos.checked = false;
      }

      // Filtra a base original de dados
      let dadosFiltrados = dadosBrutosCSV;
      if (selecionadas.length < checkboxes.length) {
        dadosFiltrados = dadosBrutosCSV.filter(linha => {
          const local = linha['LOCAL_ATEND'];
          return local && selecionadas.includes(String(local).trim());
        });
      }

      processarDadosCSV(dadosFiltrados);
    }

    function processarDadosCSV(linhas) {
      const idsProcessados = new Set();
      const consultores = {};
      const turnos = {};
      let somaEspera = 0;
      let qtdEsperaValida = 0;

      linhas.forEach(linha => {
        const idAtendimento = linha['NOME_PACIENTE'];
        const consultor     = linha['CONSULTOR'];
        const turno         = linha['TURNO'];
        
        const valorTempo = linha['TEMPO_RESPOSTA_HORAS'] || linha['TEMPO_RESPOSTA_DIAS'];
        const tempoEspera = converterParaNumero(valorTempo);

        if (!idAtendimento || String(idAtendimento).trim() === '') return;

        idsProcessados.add(String(idAtendimento).trim());

        if (consultor && String(consultor).trim() !== '') {
          const nomeConsultor = String(consultor).trim();
          consultores[nomeConsultor] = (consultores[nomeConsultor] || 0) + 1;
        }

        if (turno && String(turno).trim() !== '') {
          const nomeTurno = String(turno).trim();
          turnos[nomeTurno] = (turnos[nomeTurno] || 0) + 1;
        }

        if (!isNaN(tempoEspera)) {
          somaEspera += tempoEspera;
          qtdEsperaValida++;
        }
      });

      document.getElementById('kpi-total-unicos').innerText = idsProcessados.size;
      document.getElementById('kpi-total-registros').innerText = linhas.length;
      
      const mediaFinal = qtdEsperaValida > 0 ? (somaEspera / qtdEsperaValida).toFixed(1) : 0;
      document.getElementById('kpi-tempo-medio').innerText = `${mediaFinal} h`;

      renderizarGraficoBarras('graficoConsultores', Object.keys(consultores), Object.values(consultores), 'Atendimentos');
      renderizarGraficoPizza('graficoTurnos', Object.keys(turnos), Object.values(turnos));
    }

    function renderizarGraficoBarras(idCanvas, rotulos, dados, legenda) {
      if (instanciaGraficoBarras) {
        instanciaGraficoBarras.destroy();
      }

      const ctx = document.getElementById(idCanvas).getContext('2d');
      instanciaGraficoBarras = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: rotulos,
          datasets: [{
            label: legenda,
            data: dados,
            backgroundColor: '#0056b3',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderizarGraficoPizza(idCanvas, rotulos, dados) {
      if (instanciaGraficoPizza) {
        instanciaGraficoPizza.destroy();
      }

      const ctx = document.getElementById(idCanvas).getContext('2d');
      instanciaGraficoPizza = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: rotulos,
          datasets: [{
            data: dados,
            backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6f42c1', '#17a2b8', '#fd7e14']
          }]
        },
        options: {
          responsive: true
        }
      });
    }

    // Leitura com parâmetro ENCODING
    Papa.parse(NOME_ARQUIVO_CSV, {
      download: true,
      header: true,
      skipEmptyLines: true,
      encoding: "ISO-8859-1",
      complete: function(results) {
        if (results.data && results.data.length > 0) {
          dadosBrutosCSV = results.data;
          preencherOpcoesDeFiltro(dadosBrutosCSV);
          processarDadosCSV(dadosBrutosCSV);
        }
      }
    });
  </script>
</body>
</html>
